version: "2"
sql:
  - engine: postgresql
    # sqlc lê os arquivos do goose e ignora as seções "-- +goose Down".
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/platform/database/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              type: int16
              pointer: true
